name: Game quality

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'tests/**', 'package*.json', '.github/workflows/**', 'tsconfig.json', 'index.html', 'vercel.json']
  pull_request:
    paths: ['src/**', 'public/**', 'tests/**', 'package*.json', '.github/workflows/**', 'tsconfig.json', 'index.html', 'vercel.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Playable flows, records, sharing and repeat play
        run: npm run test:replay
        env:
          BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: artifacts/replay/${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: game-quality-${{ matrix.browser }}
          path: artifacts/replay/${{ matrix.browser }}
          if-no-files-found: ignore
          retention-days: 14
