name: iOS app
on:
  push:
    branches: [ios-share, main]
    paths: ['ios/**','src/**','public/**','scripts/*ios*','capacitor.config.ts','package*.json','.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5180 &
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:5180/ > /dev/null
          npx tsx tests/ios-social-browser.ts
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-web-${{ matrix.browser }}
          path: artifacts/ios-web/${{ matrix.browser }}/
          retention-days: 1
  simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync ios
      - name: Prepare native UI tests
        run: |
          gem install xcodeproj --user-install --no-document --version 1.27.0
          npx tsx scripts/ios-fixtures.ts
          ruby scripts/configure-ios-tests.rb
          xcodebuild -version
      - name: Build and test the actual iOS app
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); phones=[x for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]; print(next((x["udid"] for x in phones if "Max" in x["name"]),phones[0]["udid"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl spawn "$DEVICE_ID" log stream --level debug --style compact --predicate 'process == "App"' > artifacts/ios/native-console.log 2>&1 &
          NEKO_LOG_PID=$!
          trap 'kill "$NEKO_LOG_PID" 2>/dev/null || true' EXIT
          xcodebuild test -project ios/App/App.xcodeproj -scheme App -destination "platform=iOS Simulator,id=$DEVICE_ID" -skip-testing:AppUITests/GameUITests/test03TabletLayout -derivedDataPath ios/DerivedData -resultBundlePath artifacts/ios/Simulator.xcresult CODE_SIGNING_ALLOWED=NO | tee artifacts/ios/simulator.log
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" jp.shunpei1130.nekotsubushi data)
          swift scripts/validate-ios-video.swift "$APP_DATA/Library/Caches"
          python3 - "$APP_DATA/Library/Caches" <<'PY'
          from pathlib import Path
          import shutil,sys
          shutil.copy2(next(Path(sys.argv[1]).rglob('*.mp4')), 'artifacts/ios/tiktok-native.mp4')
          PY
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/ios/simulator.png
          xcrun xcresulttool export attachments --path artifacts/ios/Simulator.xcresult --output-path artifacts/ios/phone-screenshots
          xcrun simctl shutdown "$DEVICE_ID"
          PAD_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPad")))')
          xcrun simctl boot "$PAD_ID"
          xcrun simctl bootstatus "$PAD_ID" -b
          xcodebuild test -project ios/App/App.xcodeproj -scheme App -destination "platform=iOS Simulator,id=$PAD_ID" -only-testing:AppUITests/GameUITests/test03TabletLayout -derivedDataPath ios/DerivedData -resultBundlePath artifacts/ios/Tablet.xcresult CODE_SIGNING_ALLOWED=NO | tee artifacts/ios/tablet.log
          xcrun xcresulttool export attachments --path artifacts/ios/Tablet.xcresult --output-path artifacts/ios/tablet-screenshots
      - name: Export lightweight native diagnostics
        if: always()
        run: |
          mkdir -p artifacts/ios-review
          for NEKO_RESULT in Simulator Tablet; do
            if [ -d "artifacts/ios/${NEKO_RESULT}.xcresult" ]; then
              xcrun xcresulttool export attachments --path "artifacts/ios/${NEKO_RESULT}.xcresult" --output-path "$RUNNER_TEMP/neko-review-${NEKO_RESULT}" || true
              xcrun xcresulttool get test-results summary --path "artifacts/ios/${NEKO_RESULT}.xcresult" > "artifacts/ios-review/${NEKO_RESULT}-summary.json" || true
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil
          out=Path('artifacts/ios-review')
          for source in Path(os.environ['RUNNER_TEMP']).glob('neko-review-*'):
              target=out/source.name;target.mkdir(exist_ok=True)
              for p in source.rglob('*'):
                  if p.is_file() and p.suffix.lower() in ['.png','.json','.txt']:
                      shutil.copy2(p,target/p.name)
          for p in Path('artifacts/ios').glob('*.log'):
              shutil.copy2(p,out/p.name)
          video=Path('artifacts/ios/tiktok-native.mp4')
          if video.exists(): shutil.copy2(video,out/video.name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nekotsubushi-ios-review
          path: artifacts/ios-review/
          retention-days: 1
      - name: Build unsigned App Store archive
        run: |
          set -euo pipefail
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS -archivePath artifacts/ios/Nekotsubushi-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO | tee artifacts/ios/archive.log
          test -d artifacts/ios/Nekotsubushi-unsigned.xcarchive/Products/Applications/App.app
          python3 -c 'from pathlib import Path; assert b"NEKO_UI_TEST_SAVE" not in Path("artifacts/ios/Nekotsubushi-unsigned.xcarchive/Products/Applications/App.app/App").read_bytes(), "Debug fixture must not ship in Release"'
          ditto -c -k --sequesterRsrc --keepParent artifacts/ios/Nekotsubushi-unsigned.xcarchive artifacts/ios/Nekotsubushi-unsigned.xcarchive.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nekotsubushi-ios-unsigned-archive
          path: artifacts/ios/Nekotsubushi-unsigned.xcarchive.zip
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nekotsubushi-ios-build-and-tests
          path: artifacts/ios/
          retention-days: 1
