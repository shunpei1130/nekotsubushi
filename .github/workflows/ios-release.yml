name: Sign iOS and upload to App Store Connect
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: app-store
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm test && npm run ios:sync
      - name: Prepare Xcode signing tools
        run: gem install xcodeproj --user-install --no-document --version 1.27.0
      - name: Import owner-provided signing material
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-ios-signing.py
          NEKO_KEYCHAIN_PASSWORD=$(uuidgen)
          NEKO_KEYCHAIN_PATH="$RUNNER_TEMP/neko-signing.keychain-db"
          security create-keychain -p "$NEKO_KEYCHAIN_PASSWORD" "$NEKO_KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$NEKO_KEYCHAIN_PATH"
          security unlock-keychain -p "$NEKO_KEYCHAIN_PASSWORD" "$NEKO_KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/neko-signing.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$NEKO_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$NEKO_KEYCHAIN_PASSWORD" "$NEKO_KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$NEKO_KEYCHAIN_PATH"
      - name: Configure the app target for manual distribution signing
        run: |
          ruby -r xcodeproj -e 'p=Xcodeproj::Project.open("ios/App/App.xcodeproj");t=p.targets.find{|x|x.name=="App"};t.build_configurations.each{|c|c.build_settings["CODE_SIGN_STYLE"]="Manual";c.build_settings["DEVELOPMENT_TEAM"]=ENV.fetch("NEKO_TEAM_ID");c.build_settings["PROVISIONING_PROFILE_SPECIFIER"]=ENV.fetch("NEKO_PROFILE_UUID");c.build_settings["CODE_SIGN_IDENTITY"]="Apple Distribution"};p.save;s=Xcodeproj::XCScheme.new;s.add_build_target(t);s.set_launch_target(t);s.save_as("ios/App/App.xcodeproj","App",true)'
      - name: Archive and export the signed IPA
        run: |
          set -euo pipefail
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Nekotsubushi.xcarchive" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Nekotsubushi.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/neko-export.plist" -exportPath artifacts/ios-signed
      - name: Upload using the owner's App Store Connect key
        if: inputs.upload
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -c 'import base64,os,pathlib,re; key=os.environ["ASC_KEY_ID"]; assert re.fullmatch("[A-Z0-9]{10}",key); p=pathlib.Path.home()/".appstoreconnect/private_keys";p.mkdir(parents=True,exist_ok=True);f=p/("AuthKey_"+key+".p8");f.write_bytes(base64.b64decode(os.environ["ASC_API_KEY_P8_BASE64"],validate=True));f.chmod(0o600)'
          IPA_PATH=$(python3 -c 'from pathlib import Path; print(next(Path("artifacts/ios-signed").glob("*.ipa")))')
          xcrun iTMSTransporter -m upload -assetFile "$IPA_PATH" -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nekotsubushi-signed-ios
          path: artifacts/ios-signed/
          retention-days: 1
      - name: Remove temporary signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/neko-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/neko-signing.p12" "$RUNNER_TEMP/neko-profile.mobileprovision"
          if [ -n "$ASC_KEY_ID" ]; then rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"; fi
          if [ -n "${NEKO_PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${NEKO_PROFILE_UUID}.mobileprovision"; fi
